name: wolverines
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pytorch=2.7.1
  - torchvision=0.22.1
  - pytorch-cuda=12.1  # REQUIRED: GPU/CUDA support for cluster deployment
  - numpy>=1.24.0,<2.0.0
  - pandas>=2.0.0
  - scikit-learn>=1.3.0
  - matplotlib>=3.5.0
  - seaborn>=0.12.0
  - scipy>=1.10.0
  - pillow>=10.0.0
  - pip
  - pip:
    - datasets>=3.0.0
    - git+https://github.com/huggingface/transformers.git