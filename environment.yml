name: wolverines
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pytorch=2.7.1
  - torchvision=0.22.1
  - numpy>=1.24.0,<2.0.0
  - pandas>=2.0.0
  - scikit-learn>=1.3.0
  - matplotlib>=3.5.0
  - seaborn>=0.12.0
  - scipy>=1.10.0
  - pillow>=10.0.0
  - pip
  - pip:
    - datasets>=3.0.0
    - bokeh>=3.0.0
    - peft>=0.17.1
    - timm>=0.9.0
    - open_clip_torch>=2.20.0
    - tqdm>=4.64.0
    - opencv-python>=4.8.0
    - requests>=2.28.0
    - PytorchWildlife
    - python-dotenv>=0.19.0
    - git+https://github.com/huggingface/transformers.git